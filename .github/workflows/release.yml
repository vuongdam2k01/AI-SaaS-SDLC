name: Release package

on:
  push:
    tags: ["v*"]

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - run: npm install -g @anthropic-ai/claude-code
      - name: Verify plugin and marketplace manifests
        run: |
          claude plugin validate . --strict
          npm run validate:manifests
      - name: Build archive
        run: git archive --format=zip --output=ai-saas-sdlc-${GITHUB_REF_NAME}.zip HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: ai-saas-sdlc-${{ github.ref_name }}
          path: ai-saas-sdlc-${{ github.ref_name }}.zip
